[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rheo-superposition"
version = "5.0.5"
description = "Rheological superposition of dynamic, stress-relaxation and creep data"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
# launcher.py adds src/ to sys.path before importing the application.
"launcher.py" = ["I001"]
# GUI callbacks deliberately convert unexpected application errors into dialogs.
"src/rheo_superposition/gui/app.py" = ["BLE001"]
